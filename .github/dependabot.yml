# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
# This file is managed by Terraform and generated automatically. Do not edit it directly.
---
version: 2
registries:
    billyfree:
        type: npm-registry
        url: https://registry.npmjs.org
        scope: '@billyfree'
        token: ${{secrets.NPM_REGISTRY_REGISTRY_NPMJS_ORG_TOKEN}}
    npmjs-org:
        type: npm-registry
        url: https://registry.npmjs.org
        scope: '@shinetools'
        token: ${{secrets.NPM_REGISTRY_REGISTRY_NPMJS_ORG_TOKEN}}
updates:
    - package-ecosystem: github-actions
      directories:
        - /
      schedule:
        interval: weekly
        day: monday
        time: "04:00"
        timezone: Europe/Paris
      open-pull-requests-limit: 5
      allow:
        - dependency-type: direct
          update-types:
            - version-update:semver-patch
      groups:
        github-actions-minor-and-patch:
            patterns:
                - '*'
            update-types:
                - minor
                - patch
        internal-github-actions:
            patterns:
                - shinetools/github-actions
                - shinetools/github-actions/**
                - ageras-com/github-actions
                - ageras-com/github-actions/**
                - billysbilling/github-actions
                - billysbilling/github-actions/**
      cooldown:
        default-days: 3
    - package-ecosystem: npm
      directories:
        - /
      schedule:
        interval: weekly
        day: monday
        time: "04:00"
        timezone: Europe/Paris
      open-pull-requests-limit: 5
      registries:
        - billyfree
        - npmjs-org
      allow:
        - dependency-type: direct
          update-types:
            - version-update:semver-patch
      groups:
        jest:
            patterns:
                - jest
                - jest-*
                - '@types/jest'
                - ts-jest
        linter-prettier:
            patterns:
                - eslint*
                - prettier*
                - '@typescript-eslint/*'
                - lint-staged
        nestjs:
            patterns:
                - '@nestjs/*'
        node-dependencies:
            patterns:
                - '@types/node'
                - ts-node
            dependency-type: development
        node-development:
            patterns:
                - '*'
            dependency-type: development
            update-types:
                - minor
                - patch
        node-minor-and-patch:
            patterns:
                - '*'
            update-types:
                - minor
                - patch
        node-production:
            patterns:
                - '*'
            dependency-type: production
            update-types:
                - minor
                - patch
        nx:
            patterns:
                - nx
                - '@nx/*'
        shinetools-dev:
            patterns:
                - '@shinetools/*'
            dependency-type: development
        shinetools-prod:
            patterns:
                - '@shinetools/*'
            dependency-type: production
      cooldown:
        default-days: 3
        semver-major-days: 3
        semver-minor-days: 3
        semver-patch-days: 3
